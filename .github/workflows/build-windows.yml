name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - '0.10'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          # 这一步非常重要：必须先安装项目本身，否则 .spec 文件里的 import 语句会报错
          pip install .
          pip install pyinstaller platformdirs

      - name: Run PyInstaller
        run: |
          # 使用你 .spec 里的逻辑进行打包
          # 指定输出目录为 ./dist_output
          python -m PyInstaller -y --distpath ./dist_output installer/Amulet.spec

      - name: Upload Finished EXE
        uses: actions/upload-artifact@v4
        with:
          name: Amulet-Map-Editor-Windows
          path: ./dist_output/amulet/
